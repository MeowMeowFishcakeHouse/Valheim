[Builders]

## Building costs less at your base: each material is discounted while its home station is inside YardRadius, and beams/poles use the flat framing rule (1 of each material free-standing, 0 when snapped onto another beam). Deconstruct refunds exactly what was paid. Build pieces only - crafting recipes are never touched. Requires [Discount] Enabled at startup: the shared build-cost machinery this module feeds is installed there.
# Setting type: Boolean
# Default value: true
Enabled = true

## How far, in metres, a crafting station discounts its own materials. This is the YARD - deliberately much larger than a workbench's build range, so one base with the workbench, stonecutter and forge spread out still counts as one yard. Measured horizontally from the station, the same way vanilla measures build range. 0 = the yard never applies.
# Setting type: Single
# Default value: 80
YardRadius = 80

## Comma-separated MaterialPrefabName:multiplier pairs. Each material costs that fraction of vanilla while its home station (see Stations) is inside YardRadius, and full price everywhere else. 0.5 = half, 0.10 = a tenth. Clamped to 0.01..1: this module never makes anything more expensive. Materials that are not listed are never discounted. Names are ITEM PREFAB names and are checked against ObjectDB once the world loads; unknown names are logged once and ignored.
# Setting type: String
# Default value: Wood:0.5,RoundLog:0.5,FineWood:0.5,Stone:0.5,Iron:0.5,Bronze:0.5,Copper:0.5,BlackMetal:0.5
Materials = Wood:0.5,RoundLog:0.5,FineWood:0.5,Stone:0.5,Iron:0.5,Bronze:0.5,Copper:0.5,BlackMetal:0.5

## Which station discounts which materials: comma-separated StationPrefabName:Material|Material|... entries. A material is only ever cheap while one of ITS OWN stations is in range, so hauling stone to a forge buys you nothing. A material listed in Materials with no station here is never discounted (and is called out in the log at world load). Free text rather than a tick list because each entry carries a list of its own.
# Setting type: String
# Default value: piece_workbench:Wood|RoundLog|FineWood,piece_stonecutter:Stone,forge:Iron|Bronze|Copper,blackforge:BlackMetal
Stations = piece_workbench:Wood|RoundLog|FineWood,piece_stonecutter:Stone,forge:Iron|Bronze|Copper,blackforge:BlackMetal

## Off (the default): the full discount applies the moment the station stands. On: the discount scales with the station's own upgrade level, so a bare bench in the wild gives a fraction of it and a fully kitted hall gives all of it. "Full" is derived from the game itself - the number of distinct station extensions that exist for that station - so a station with no extensions at all (the stonecutter) always gives the full discount.
# Setting type: Boolean
# Default value: false
StationLevelScaling = false

## Per-material floor override: comma-separated MaterialPrefabName:floor pairs. Empty (the default) means every material keeps the pipeline's normal floor, so a requirement never drops below 1. "Iron:0" lets iron round all the way to zero and DROP OFF the piece entirely - at a forge a wood-iron beam would then cost 0 iron and 1 wood. Refunds of a zero-cost material are zero, so nothing can be farmed with it. Use "Iron:1" to dial it back without touching the multiplier.
# Setting type: String
# Default value: 
MinAmounts = 

## Adjustments to the auto-discovered structural set (the beams and poles the framing rule applies to). The set is found by walking the hammer's own piece table and keeping every piece whose prefab name has a "beam" or "pole" part, or contains log_26 / log_45 - the discovered list is logged once per world load. List a piece PREFAB name here to ADD it, or prefix it with a minus ("-wood_pole") to REMOVE one the pattern picked up by mistake. Empty = the auto-discovered set exactly.
# Setting type: String
# Default value: 
StructuralPieces = 

## What a free-standing beam or pole costs: this many of EACH of its materials, whatever the recipe says. 1 (the default) means the first pole of a support tower costs 1 iron and 1 wood. Never more than the piece's vanilla cost.
# Setting type: Int32
# Default value: 1
StructuralFirstCost = 1

## What a beam or pole costs when it is SNAPPED ONTO ANOTHER BEAM OR POLE: this many of each of its materials. 0 (the default) makes framing free once the first one is paid for, so a 5-high iron support tower costs 1 iron and 1 wood in total. Snapping onto a wall, a floor or a roof does not count.
# Setting type: Int32
# Default value: 0
StructuralAttachedCost = 0

## Off (the default): the framing rule applies everywhere - vanilla already gates wooden beams to a workbench and iron beams to a forge, which is gate enough. On: the framing rule only applies while at least one of the piece's materials has its home station inside YardRadius; outside, beams cost the normal discounted price.
# Setting type: Boolean
# Default value: false
StructuralInYardOnly = false

## On (the default): EVERY build piece writes down what it actually paid, so tearing it down gives back exactly that - wherever it was built. Off restores the behaviour before 0.10.2, where only beams and poles kept a record and everything else was refunded by recomputing the price at its cheapest, which short-changed anything built away from a yard (a Sap extractor placed out on a Mistlands root cost about 3 black metal and gave back 1). Read at the moment the hammer swings, so a change applies to the next piece placed; pieces already standing keep whatever record they were built with.
# Setting type: Boolean
# Default value: true
RecordAllPieces = true

## How long a station keeps counting as "in range" after you walk out of its yard, so a displayed cost cannot flicker while you stand on the boundary. 0 = snap back instantly.
# Setting type: Single
# Default value: 3
HysteresisSeconds = 3

## How often the "is my station in range?" scan actually runs. The answer is cached in between, because the build HUD asks for a piece's cost every frame. Clamped to 0.05..5.
# Setting type: Single
# Default value: 0.5
CheckIntervalSeconds = 0.5

## Add one short line to the build hammer's piece description saying why the piece costs what it costs ("Yard -50% Wood, -90% Iron" / "Framing: attached -> free"). Display only. Turn off if you would rather read the numbers alone.
