[Access]

## Enable the in-game settings door: the RPC that lets players change settings from Valheim's own Settings menu. Off = the tab still lists everything, but nothing can be changed from it and only the cfg file (or an admin's ConfigurationManager) works.
# Setting type: Boolean
# Default value: true
Enabled = true

## Who may change a server-synced setting from the in-game settings tab. Everyone = any player on the server (settings marked admin-only still are). Admins = only players in adminlist.txt. Changing this takes effect immediately.
# Setting type: TweakAccess
# Default value: Everyone
# Acceptable values: Everyone, Admins
TweakAccess = Everyone

## How a change is told to the rest of the server. Chat = one chat line attributed to the player who made it. Message = a top-left message on everyone's screen. Both = both. Off = nothing on screen (the server log still records every change).
# Setting type: Announce
# Default value: Chat
# Acceptable values: Chat, Message, Both, Off
Announce = Chat

## How many changes one player may make in any ten seconds before the server starts refusing. Stops an accident (or a joke) from rewriting the whole config at once.
# Setting type: Int32
# Default value: 10
MaxChangesPer10s = 10

## Dedicated server only: at world load, drive the whole settings door once - change a harmless setting through the same path a player's menu uses, prove the cfg file on disk changed (with its timestamped backup), hold it for 45 seconds so it can be seen from outside, then undo it. Everything is written to the log. Off by default.
# Setting type: Boolean
# Default value: false
SelfTest = false

## Dedicated server only: at world load, drive the settings door against the SmoothServer settings the Network panel exposes - flip the network preset and back, re-reading the cfg file from disk each time, undo both changes, and prove the door refuses a SmoothServer key that is not on the panel's allowlist and an admin-only one asked for by a non-admin. Everything is restored. Needs SmoothServer installed on this server; otherwise it logs that and stops. Off by default.
# Setting type: Boolean
# Default value: false
NetworkSelfTest = false

