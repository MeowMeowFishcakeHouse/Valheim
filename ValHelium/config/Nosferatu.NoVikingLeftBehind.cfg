# Default value: true
ShowTooltip = true

## The Builder skill: a per-character skill, 0-100, that makes every build piece a little cheaper the more you have built. Tracked by this mod in the character file (not a vanilla skill), so it is never lost on death and never shows up in the vanilla skills panel. Off = no skill discount and no XP is recorded.
# Setting type: Boolean
# Default value: true
SkillEnabled = true

## Builder XP per unit of VANILLA material in a piece you place: a 4-stone wall earns 4, a torch earns 1. The vanilla count is used, so a beam made free by the framing rule still earns what a beam is worth - it is still building. The level curve is vanilla's own (pow(level+1, 1.5) * 0.5 + 0.5 per level), so raise this to level faster. Deconstructing earns nothing.
# Setting type: Single
# Default value: 1
SkillXpPerMaterial = 1

## How much cheaper build pieces are at Builder level 100, as a fraction. 0.30 = 30% off at Lv 100, linear on the way up, so Lv 50 is 15% off. 0 = the skill is still tracked and shown but costs nothing. Clamped to 0..0.9.
# Setting type: Single
# Default value: 0.3
SkillMaxDiscount = 0.3

## Rhythm: placing the SAME piece over and over gets cheaper as you find a groove, and resets the moment you switch piece or stop. Local to each builder and never stored anywhere.
# Setting type: Boolean
# Default value: true
RhythmEnabled = true

## How long, in seconds, the streak survives between placements. Pause longer than this and the rhythm resets to nothing.
# Setting type: Single
# Default value: 20
RhythmWindowSec = 20

## How much cheaper each repeat of the same piece makes the next one, as a fraction. 0.05 = 5% per repeat.
# Setting type: Single
# Default value: 0.05
RhythmPerRepeat = 0.05

## Ceiling on the rhythm discount, as a fraction. 0.25 with RhythmPerRepeat 0.05 means five in a row is as good as it gets. Deconstruct refunds always assume FULL rhythm, so a refund can never exceed what the piece was bought for.
# Setting type: Single
# Default value: 0.25
RhythmMax = 0.25

